<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WasiTube - Premium Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff0000;
            --gold: #ffcc00;
            --bg: #000000;
            --card: #111111;
            --gray: #1a1a1a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }

        /* --- STYLISH HEADER --- */
        header {
            background: #000; padding: 12px 5%; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--gray); gap: 15px;
        }
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo i { color: var(--gold); font-size: 1.8rem; }
        .logo span { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; text-transform: uppercase; }

        /* HIGH QUALITY SEARCH BAR */
        .search-container { flex: 1; max-width: 550px; position: relative; display: flex; align-items: center; }
        .search-container input {
            width: 100%; padding: 12px 20px; border-radius: 50px; border: 1px solid #333;
            background: #0d0d0d; color: white; outline: none; font-size: 14px; transition: 0.3s;
        }
        .search-container input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(255,0,0,0.3); background: #000; }
        .search-btn { position: absolute; right: 5px; background: var(--primary); border: none; color: white; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- SIDEBAR --- */
        .menu-icon { font-size: 1.5rem; cursor: pointer; }
        #sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: #080808; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 40px 20px;
        }
        #sidebar.active { left: 0; }
        .side-link { padding: 15px; display: flex; align-items: center; gap: 15px; color: #bbb; text-decoration: none; border-radius: 12px; margin-bottom: 10px; transition: 0.3s; }
        .side-link:hover { background: #1a1a1a; color: #fff; transform: translateX(10px); }
        .side-link i { color: var(--primary); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1500; }

        /* --- MAIN CONTENT LAYOUT --- */
        .app-body { max-width: 1200px; margin: 20px auto; padding: 0 5%; display: flex; flex-direction: column; gap: 30px; }
        
        /* PLAYER SECTION */
        #player-view { display: none; width: 100%; }
        .video-box { 
            width: 100%; background: #000; border-radius: 15px; overflow: hidden; 
            border: 1px solid var(--gray); aspect-ratio: 16/9; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        iframe { width: 100%; height: 100%; border: none; }
        .video-info { margin-top: 20px; border-bottom: 1px solid var(--gray); padding-bottom: 20px; }
        .video-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
        
        /* GRID SYSTEM */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .v-card { background: transparent; cursor: pointer; transition: 0.3s; }
        .v-card:hover { transform: translateY(-5px); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #111; position: relative; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-details { padding: 12px 5px; }
        .v-title { font-size: 14px; font-weight: 600; line-height: 1.4; height: 40px; overflow: hidden; margin-bottom: 5px; color: #fff; }
        .v-meta { font-size: 12px; color: #888; }

        /* --- WHATSAPP & DEV --- */
        .action-bar { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border-radius: 8px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-wa { background: #25d366; color: white; }
        .btn-dev { background: #fff; color: #000; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }

        .loader { width: 40px; height: 40px; border: 3px solid #222; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 50px auto; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            header { padding: 10px 15px; }
            .search-container { max-width: 200px; }
            .logo span { display: none; }
            .video-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="overlay" onclick="toggleMenu()"></div>
    
    <!-- Sidebar -->
    <div id="sidebar">
        <div style="font-family:'Montserrat'; font-size: 1.8rem; color: var(--gold); margin-bottom: 30px;">WASI TUBE</div>
        <a href="/" class="side-link" onclick="event.preventDefault(); location.href='/';"><i class="fas fa-home"></i> Home Feed</a>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" target="_blank" class="side-link"><i class="fab fa-whatsapp"></i> Join WhatsApp Group</a>
        <a href="https://wa.me/923342002756" target="_blank" class="side-link" style="border: 1px solid #333;"><i class="fas fa-code"></i> Contact Developer</a>
        <a href="#" class="side-link"><i class="fas fa-heart"></i> Favorites</a>
    </div>

    <!-- Header -->
    <header>
        <div class="menu-icon" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="logo" onclick="location.href='/'">
            <i class="fas fa-crown"></i>
            <span>WASI<span style="color:var(--primary)">TUBE</span></span>
        </div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search videos, songs, movies...">
            <button class="search-btn" onclick="handleSearch()"><i class="fas fa-search"></i></button>
        </div>
        <div><i class="fas fa-user-circle" style="font-size: 1.6rem; color: #222;"></i></div>
    </header>

    <!-- App Body -->
    <div class="app-body">
        
        <!-- Player View (Dynamic) -->
        <div id="player-view">
            <div class="video-box">
                <iframe id="main-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="video-info">
                <h1 id="playing-title" class="video-title">Video Title Loading...</h1>
                <div class="v-meta" id="playing-meta">Loading details...</div>
                <div class="action-bar">
                    <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Join Group</a>
                    <a href="https://wa.me/923342002756" class="btn btn-dev"><i class="fas fa-headset"></i> Contact Dev</a>
                </div>
            </div>
        </div>

        <!-- Suggestions / Grid View -->
        <div id="grid-view">
            <h2 id="grid-header" style="margin-bottom:20px; font-weight:800; letter-spacing:-1px;">Trending Now</h2>
            <div class="video-grid" id="main-grid">
                <!-- Videos will load here -->
            </div>
        </div>

    </div>

    <script>
        const API_NODES = ["https://api.piped.private.coffee", "https://pipedapi.mha.fi", "https://inv.nadeko.net"];
        
        // --- ROUTING SYSTEM ---
        function slugify(text) {
            return text.toString().toLowerCase()
                .replace(/\s+/g, '-')           
                .replace(/[^\w\-]+/g, '')       
                .replace(/\-\-+/g, '-')         
                .replace(/^-+/, '')             
                .replace(/-+$/, '');            
        }

        async function initApp() {
            const path = window.location.pathname.replace(/^\/|\/$/g, '');
            if (path && path !== 'index.html') {
                // If path exists, treat it as a video title and search it
                const query = path.replace(/-/g, ' ');
                await renderGrid(query, true); 
            } else {
                renderGrid("new bollywood songs 2024");
            }
        }

        // --- CORE FUNCTIONS ---
        function toggleMenu() {
            const sb = document.getElementById('sidebar');
            const ol = document.querySelector('.overlay');
            sb.classList.toggle('active');
            ol.style.display = sb.classList.contains('active') ? 'block' : 'none';
        }

        function handleSearch() {
            const q = document.getElementById('search-input').value;
            if(q) {
                window.history.pushState({}, '', '/');
                renderGrid(q);
            }
        }

        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') handleSearch();
        });

        async function fetchVideos(query) {
            for (let node of API_NODES) {
                try {
                    const res = await fetch(`${node}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    const data = await res.json();
                    return data.items.map(v => ({
                        id: v.url.split('v=')[1] || v.videoId,
                        title: v.title,
                        thumb: `https://i.ytimg.com/vi/${v.url.split('v=')[1] || v.videoId}/mqdefault.jpg`,
                        author: v.uploaderName,
                        time: v.uploadedDate || "Recently"
                    }));
                } catch (e) { continue; }
            }
            return [];
        }

        async function renderGrid(query, autoPlayFirst = false) {
            const grid = document.getElementById('main-grid');
            const header = document.getElementById('grid-header');
            grid.innerHTML = '<div class="loader"></div>';
            header.innerText = `Results for "${query}"`;

            const videos = await fetchVideos(query);
            
            if (autoPlayFirst && videos.length > 0) {
                playVideo(videos[0].id, videos[0].title, videos[0].author, videos[0].time);
            }

            let html = '';
            videos.forEach(v => {
                html += `
                    <div class="v-card" onclick="playVideo('${v.id}', '${v.title.replace(/'/g, "")}', '${v.author}', '${v.time}')">
                        <div class="v-thumb"><img src="${v.thumb}" loading="lazy"></div>
                        <div class="v-details">
                            <div class="v-title">${v.title}</div>
                            <div class="v-meta">${v.author} • ${v.time}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html || '<p style="text-align:center">No videos found.</p>';
        }

        function playVideo(id, title, author, time) {
            // Update URL Path based on title
            const slug = slugify(title);
            window.history.pushState({id}, title, `/${slug}`);

            document.getElementById('grid-view').style.marginTop = "40px";
            const playerView = document.getElementById('player-view');
            playerView.style.display = 'block';
            
            document.getElementById('main-iframe').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            document.getElementById('playing-title').innerText = title;
            document.getElementById('playing-meta').innerText = `${author} • ${time}`;
            
            window.scrollTo({top: 0, behavior: 'smooth'});
            
            // Load more suggestions based on title
            renderGrid(author);
        }

        // Handle Back/Forward buttons
        window.onpopstate = function() {
            location.reload();
        };

        // Start App
        initApp();
    </script>
</body>
  </html>
