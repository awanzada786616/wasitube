<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WasiTube - Premium Entertainment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; --red: #ff0000; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        #splash { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.8s; perspective: 1000px; }
        .crown-3d { font-size: 80px; color: var(--gold); animation: rot 3s infinite linear; filter: drop-shadow(0 0 20px rgba(255,204,0,0.5)); }
        @keyframes rot { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        header { background: rgba(0,0,0,0.9); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-family: 'Montserrat'; }
        #sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #0a0a0a; z-index: 2000; transition: 0.3s; padding: 40px 20px; box-shadow: 10px 0 30px #000; }
        #sidebar.active { left: 0; }
        .side-link { padding: 15px; display: flex; align-items: center; gap: 15px; color: #ccc; text-decoration: none; border-radius: 12px; margin-bottom: 8px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 3px solid var(--red); }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-group { display: flex; gap: 10px; padding: 15px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; text-decoration: none; text-align: center; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; aspect-ratio: 16/9; border-radius: 12px; object-fit: cover; background: #111; }
        .v-title { font-size: 13px; font-weight: 600; margin-top: 8px; height: 35px; overflow: hidden; }
        .loader { width: 40px; height: 40px; border: 3px solid #1a1a1a; border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="splash">
        <div class="crown-3d"><i class="fas fa-crown"></i></div>
        <h1 style="margin-top:20px; letter-spacing:5px; font-family:'Montserrat'">WASI TUBE</h1>
    </div>

    <div class="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar">
        <h2 style="color:var(--gold); margin-bottom:30px;">WASI TUBE</h2>
        <a href="/" class="side-link"><i class="fas fa-home"></i> Home Feed</a>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="side-link"><i class="fab fa-whatsapp"></i> WhatsApp Group</a>
        <a href="https://wa.me/923342002756" class="side-link" style="border: 1px solid #333;"><i class="fas fa-user-shield"></i> Contact Developer</a>
    </div>

    <header>
        <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.3rem;"><i class="fas fa-bars"></i></div>
        <div class="logo">👑 WASI TUBE</div>
        <input type="text" id="srch" placeholder="Search..." style="background:#1a1a1a; border:none; color:#fff; padding:8px 15px; border-radius:20px; width:40%; outline:none;">
    </header>

    <main style="max-width:1100px; margin:0 auto;">
        <div id="player" style="display:none">
            <div class="video-box"><iframe id="ifr" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div style="padding:15px">
                <h2 id="vt" style="font-size:1.1rem; margin-bottom:15px;"></h2>
                <div class="btn-group">
                    <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="btn" style="background:#25d366; color:#fff;"><i class="fab fa-whatsapp"></i> GROUP</a>
                    <a href="https://wa.me/923342002756" class="btn" style="background:#fff; color:#000;"><i class="fas fa-headset"></i> CONTACT DEV</a>
                </div>
            </div>
        </div>
        <div class="grid" id="main-grid"></div>
    </main>

    <script>
        function toggleMenu() {
            const s = document.getElementById('sidebar');
            const o = document.querySelector('.overlay');
            s.classList.toggle('active');
            o.style.display = s.classList.contains('active') ? 'block' : 'none';
        }

        async function load(q, isAuto = false) {
            const g = document.getElementById('main-grid');
            g.innerHTML = '<div class="loader"></div>';
            try {
                // HUM APNI PRIVATE API CALL KAR RAHE HAIN
                const res = await fetch(`/.netlify/functions/api?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                
                if (data.error) {
                    g.innerHTML = `<p style="color:red; text-align:center; padding:20px;">${data.message}</p>`;
                    return;
                }

                if(isAuto && data.items.length > 0) {
                    const first = data.items[0];
                    play(first.url.split('v=')[1] || first.videoId, first.title);
                }

                g.innerHTML = '';
                data.items.forEach(v => {
                    const id = v.url.split('v=')[1] || v.videoId;
                    if(!id) return;
                    g.innerHTML += `<div class="v-card" onclick="play('${id}', '${v.title.replace(/'/g,"")}')">
                        <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg">
                        <div class="v-title">${v.title}</div>
                    </div>`;
                });
            } catch(e) {
                g.innerHTML = '<p style="text-align:center; padding:20px;">Server Busy. Refresh Page.</p>';
            }
        }

        function play(id, title) {
            document.getElementById('player').style.display = 'block';
            document.getElementById('ifr').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('vt').innerText = title;
            const slug = title.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '');
            window.history.pushState({}, '', '/' + slug);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        document.getElementById('srch').onkeypress = (e) => {
            if(e.key === 'Enter') {
                load(e.target.value);
                window.history.pushState({}, '', '/');
            }
        };

        const path = window.location.pathname.replace(/^\/|\/$/g, '').replace(/-/g, ' ');
        if(path && path.length > 2) load(path, true);
        else load("new hindi songs 2024");

        setTimeout(() => {
            const s = document.getElementById('splash');
            s.style.opacity = '0';
            setTimeout(() => s.remove(), 800);
        }, 2500);

        window.onpopstate = () => location.reload();
    </script>
</body>
</html>
