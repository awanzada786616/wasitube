
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WasiTube - Premium Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff0000;
            --gold: #ffcc00;
            --bg: #000000;
            --card: #121212;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }

        /* --- 3D SPLASH SCREEN --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            perspective: 1000px; transition: opacity 0.8s ease, visibility 0.8s;
        }
        .logo-3d {
            transform-style: preserve-3d;
            animation: rotate3d 3s infinite linear;
            position: relative;
        }
        .logo-3d i {
            font-size: 80px; color: var(--gold);
            filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.5));
        }
        .splash-text {
            margin-top: 30px; font-family: 'Montserrat', sans-serif;
            font-size: 2rem; letter-spacing: 5px; color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes rotate3d {
            0% { transform: rotateY(0deg) rotateX(0deg); }
            100% { transform: rotateY(360deg) rotateX(10deg); }
        }
        @keyframes pulse { from { opacity: 0.5; transform: scale(0.95); } to { opacity: 1; transform: scale(1.05); } }

        /* --- MODERN HEADER --- */
        header {
            background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
            padding: 10px 15px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--glass);
        }
        .menu-toggle { font-size: 1.3rem; padding: 10px; cursor: pointer; }
        .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo i { color: var(--gold); font-size: 1.5rem; }
        .logo span { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.2rem; }

        .search-container { 
            position: relative; flex: 0 0 45px; transition: all 0.4s ease;
            overflow: hidden; display: flex; align-items: center; justify-content: flex-end;
        }
        .search-container.active { flex: 1; margin-left: 10px; }
        .search-container input {
            width: 0; padding: 10px 0; border-radius: 25px; border: none;
            background: var(--card); color: white; outline: none; transition: 0.4s; opacity: 0;
        }
        .search-container.active input { width: 100%; padding: 10px 45px 10px 20px; opacity: 1; border: 1px solid #333; }
        .search-trigger {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--glass); cursor: pointer; z-index: 2;
        }

        /* --- MOBILE SIDEBAR --- */
        #sidebar {
            position: fixed; top: 0; left: -100%; width: 80%; max-width: 300px; height: 100%;
            background: #080808; z-index: 2000; transition: 0.4s; padding: 40px 20px;
            box-shadow: 20px 0 50px rgba(0,0,0,0.9);
        }
        #sidebar.active { left: 0; }
        .side-link { padding: 15px; display: flex; align-items: center; gap: 15px; color: #ccc; text-decoration: none; border-radius: 12px; margin-bottom: 8px; }
        .side-link:hover { background: var(--primary); color: #fff; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }

        /* --- PLAYER AREA --- */
        .main-content { width: 100%; max-width: 1200px; margin: 0 auto; padding-bottom: 40px; }
        #player-view { display: none; padding: 0 0 20px 0; }
        .video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .video-details { padding: 15px; border-bottom: 1px solid var(--glass); }
        .video-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
        .video-meta { font-size: 12px; color: #888; margin-bottom: 15px; }

        /* --- GRID SYSTEM --- */
        .grid-container { padding: 15px; }
        .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        /* Mobile specific grid tweak */
        @media (max-width: 480px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .v-title { font-size: 12px; height: 34px; }
        }

        .v-card { background: transparent; cursor: pointer; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: #111; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-info { padding: 8px 2px; }
        .v-title { font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px; }
        .v-author { font-size: 10px; color: #888; }

        /* --- BUTTONS --- */
        .btn-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }
        .btn-wa { background: #25d366; color: white; }
        .btn-dev { background: #fff; color: #000; }

        .loader { width: 30px; height: 30px; border: 3px solid #222; border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 3D Splash Screen -->
    <div id="splash-screen">
        <div class="logo-3d"><i class="fas fa-crown"></i></div>
        <div class="splash-text">WASI TUBE</div>
        <p style="color: #666; margin-top: 15px; font-size: 12px;">Premium Entertainment</p>
    </div>

    <!-- Sidebar & Overlay -->
    <div class="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar">
        <div style="font-family:'Montserrat'; font-size: 1.5rem; color: var(--gold); margin-bottom: 30px;">WASI TUBE</div>
        <a href="/" class="side-link" onclick="event.preventDefault(); window.location.href='/';"><i class="fas fa-home"></i> Home</a>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="side-link"><i class="fab fa-whatsapp"></i> Join WhatsApp</a>
        <a href="https://wa.me/923342002756" class="side-link" style="border:1px solid #222;"><i class="fas fa-user-cog"></i> Contact Dev</a>
    </div>

    <!-- Header -->
    <header>
        <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
        <div class="logo" onclick="window.location.href='/'">
            <i class="fas fa-crown"></i>
            <span>WASI TUBE</span>
        </div>
        <div class="search-container" id="search-box">
            <input type="text" id="search-input" placeholder="Search songs...">
            <div class="search-trigger" onclick="toggleSearch()"><i class="fas fa-search"></i></div>
        </div>
    </header>

    <div class="main-content">
        <!-- Player View -->
        <div id="player-view">
            <div class="video-wrapper">
                <iframe id="main-frame" src="" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="video-details">
                <h1 id="play-title" class="video-title">Loading...</h1>
                <p id="play-meta" class="video-meta">Please wait...</p>
                <div class="btn-row">
                    <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="btn btn-wa"><i class="fab fa-whatsapp"></i> Join Group</a>
                    <a href="https://wa.me/923342002756" class="btn btn-dev"><i class="fas fa-comment-dots"></i> Dev</a>
                </div>
            </div>
        </div>

        <!-- Grid View -->
        <div class="grid-container" id="grid-view">
            <h2 class="section-title" id="grid-title">🔥 Trending</h2>
            <div class="video-grid" id="video-grid">
                <!-- Data Dynamically Loaded -->
            </div>
        </div>
    </div>

    <script>
        const NODES = ["https://api.piped.private.coffee", "https://pipedapi.mha.fi", "https://inv.nadeko.net"];
        
        function slugify(text) {
            return text.toString().toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            const disp = document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
            document.querySelector('.overlay').style.display = disp;
        }

        function toggleSearch() {
            const box = document.getElementById('search-box');
            if(!box.classList.contains('active')) {
                box.classList.add('active');
                document.getElementById('search-input').focus();
            } else {
                const val = document.getElementById('search-input').value;
                if(val) {
                    renderGrid(val);
                    window.history.pushState({}, '', '/');
                } else {
                    box.classList.remove('active');
                }
            }
        }

        async function fetchAPI(query) {
            for (let node of NODES) {
                try {
                    const res = await fetch(`${node}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    return await res.json();
                } catch(e) { continue; }
            }
            return { items: [] };
        }

        async function renderGrid(query, autoPlay = false) {
            const grid = document.getElementById('video-grid');
            const title = document.getElementById('grid-title');
            grid.innerHTML = '<div class="loader"></div>';
            title.innerText = `Search: ${query}`;

            const data = await fetchAPI(query);
            const videos = data.items.map(v => ({
                id: v.url.split('v=')[1] || v.videoId,
                title: v.title,
                thumb: `https://i.ytimg.com/vi/${v.url.split('v=')[1] || v.videoId}/mqdefault.jpg`,
                author: v.uploaderName,
                time: v.uploadedDate || "Recently"
            }));

            if(autoPlay && videos.length > 0) {
                playVideo(videos[0].id, videos[0].title, videos[0].author, videos[0].time);
            }

            let html = '';
            videos.forEach(v => {
                html += `
                    <div class="v-card" onclick="playVideo('${v.id}', '${v.title.replace(/'/g, "")}', '${v.author}', '${v.time}')">
                        <div class="v-thumb"><img src="${v.thumb}" loading="lazy"></div>
                        <div class="v-info">
                            <div class="v-title">${v.title}</div>
                            <div class="v-author">${v.author} • ${v.time}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html || '<p>No results found</p>';
        }

        function playVideo(id, title, author, time) {
            const slug = slugify(title);
            window.history.pushState({id}, title, `/${slug}`);
            
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('main-frame').src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
            document.getElementById('play-title').innerText = title;
            document.getElementById('play-meta').innerText = `${author} • ${time}`;
            
            window.scrollTo({top: 0, behavior: 'smooth'});
            renderGrid(author); // Related videos
        }

        // INIT APP
        async function init() {
            const path = window.location.pathname.replace(/^\/|\/$/g, '');
            if (path && path !== 'index.html') {
                await renderGrid(path.replace(/-/g, ' '), true);
            } else {
                await renderGrid("new bollywood songs 2024");
            }
            
            // Hide Splash
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 800);
            }, 2500);
        }

        init();

        // Handle Back Button
        window.onpopstate = () => location.reload();
    </script>
</body>
</html>
