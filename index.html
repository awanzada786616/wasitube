<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WasiTube Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcc00; --red: #ff0000; --bg: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }

        /* 3D SPLASH */
        #splash { position: fixed; inset: 0; background: radial-gradient(circle, #1a1a1a, #000); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; perspective: 1000px; transition: 0.8s; }
        .crown-3d { font-size: 80px; color: var(--gold); animation: rot 3s infinite linear; filter: drop-shadow(0 0 20px rgba(255,204,0,0.5)); }
        @keyframes rot { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
        .splash-text { margin-top: 20px; font-family: 'Montserrat'; font-size: 2rem; letter-spacing: 5px; }

        /* HEADER */
        header { background: rgba(0,0,0,0.9); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; backdrop-filter: blur(10px); }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-family: 'Montserrat'; cursor: pointer; }
        
        /* SEARCH BAR */
        .search-container { background: #111; border-radius: 20px; padding: 8px 15px; display: flex; flex: 0.6; align-items: center; border: 1px solid #333; }
        .search-container input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 14px; }

        /* SIDEBAR */
        #sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #0a0a0a; z-index: 2000; transition: 0.3s; padding: 40px 20px; box-shadow: 10px 0 30px #000; }
        #sidebar.active { left: 0; }
        .side-link { padding: 15px; display: flex; align-items: center; gap: 15px; color: #ccc; text-decoration: none; border-radius: 12px; margin-bottom: 8px; font-weight: 600; }
        .side-link:hover { background: #1a1a1a; color: var(--gold); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 1500; }

        /* PLAYER */
        .main-content { max-width: 1000px; margin: 0 auto; }
        #player-view { display: none; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-bottom: 3px solid var(--red); }
        iframe { width: 100%; height: 100%; border: none; }
        
        .p-details { padding: 20px 15px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; }
        .btn-wa { background: #25d366; color: #fff; }
        .btn-dev { background: #fff; color: #000; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); } }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; aspect-ratio: 16/9; border-radius: 12px; object-fit: cover; background: #111; }
        .v-title { font-size: 13px; font-weight: 600; margin-top: 8px; height: 35px; overflow: hidden; line-height: 1.3; }

        .loader { width: 40px; height: 40px; border: 3px solid #1a1a1a; border-top: 3px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 3D Splash -->
    <div id="splash">
        <div class="crown-3d"><i class="fas fa-crown"></i></div>
        <div class="splash-text">WASI TUBE</div>
    </div>

    <!-- Overlay & Sidebar -->
    <div class="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar">
        <h2 style="color:var(--gold); font-family:'Montserrat'; margin-bottom:30px;">WASI TUBE</h2>
        <a href="/" class="side-link" onclick="location.href='/'; return false;"><i class="fas fa-home"></i> Home Feed</a>
        <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="side-link"><i class="fab fa-whatsapp"></i> WhatsApp Group</a>
        <a href="https://wa.me/923342002756" class="side-link" style="border: 1px solid #333;"><i class="fas fa-user-shield"></i> Contact Dev</a>
    </div>

    <!-- Header -->
    <header>
        <div onclick="toggleMenu()" style="cursor:pointer; font-size:1.4rem;"><i class="fas fa-bars"></i></div>
        <div class="logo" onclick="location.href='/'">👑 WASI TUBE</div>
        <div class="search-container">
            <input type="text" id="srch" placeholder="Search premium songs...">
        </div>
    </header>

    <main class="main-content">
        <div id="player-view">
            <div class="video-box"><iframe id="ifr" src="" allowfullscreen allow="autoplay"></iframe></div>
            <div class="p-details">
                <h2 id="vt" style="font-size:1.1rem"></h2>
                <div class="btn-group">
                    <a href="https://chat.whatsapp.com/EZhxFOubSr4IWqANqsi2AL" class="btn btn-wa"><i class="fab fa-whatsapp"></i> GROUP</a>
                    <a href="https://wa.me/923342002756" class="btn btn-dev"><i class="fas fa-headset"></i> CONTACT DEV</a>
                </div>
            </div>
        </div>
        <h3 id="g-header" style="padding:15px 15px 0; font-weight:800;">🔥 Trending</h3>
        <div class="grid" id="main-grid"></div>
    </main>

    <script>
        function slugify(t) { return t.toString().toLowerCase().replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, ''); }

        function toggleMenu() {
            const s = document.getElementById('sidebar');
            const o = document.querySelector('.overlay');
            s.classList.toggle('active');
            o.style.display = s.classList.contains('active') ? 'block' : 'none';
        }

        async function loadData(q, isAuto = false) {
            const g = document.getElementById('main-grid');
            g.innerHTML = '<div class="loader"></div>';
            try {
                // IMPORTANT: We use /api/ shortcut defined in netlify.toml
                const res = await fetch(`/api/?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                
                if (data.error) {
                    g.innerHTML = `<p style="text-align:center; padding:20px; color:red;">${data.message}</p>`;
                    return;
                }

                if(isAuto && data.items.length > 0) {
                    playVideo(data.items[0].url.split('v=')[1] || data.items[0].videoId, data.items[0].title);
                }

                g.innerHTML = '';
                data.items.forEach(v => {
                    const id = v.url.split('v=')[1] || v.videoId;
                    if(!id) return;
                    g.innerHTML += `<div class="v-card" onclick="playVideo('${id}', '${v.title.replace(/'/g,"")}')">
                        <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg">
                        <div class="v-title">${v.title}</div>
                    </div>`;
                });
            } catch(e) {
                g.innerHTML = '<p style="text-align:center; padding:20px;">Connection Error. Refresh Page.</p>';
            }
        }

        function playVideo(id, title) {
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('ifr').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('vt').innerText = title;
            document.getElementById('g-header').innerText = "Up Next";
            window.history.pushState({}, title, `/${slugify(title)}`);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        document.getElementById('srch').onkeypress = (e) => {
            if(e.key === 'Enter') {
                loadData(e.target.value);
                window.history.pushState({}, '', '/');
            }
        };

        // Splash handling
        setTimeout(() => {
            const s = document.getElementById('splash');
            s.style.opacity = '0';
            setTimeout(() => s.remove(), 800);
        }, 2500);

        // Path handling
        const path = window.location.pathname.replace(/^\/|\/$/g, '').replace(/-/g, ' ');
        if(path && path.length > 2) loadData(path, true);
        else loadData("new hindi songs 2024");

        window.onpopstate = () => location.reload();
    </script>
</body>
</html>
